<style>
:root{
  --bg:#f6f7f9;--yuz:#ffffff;--yuz2:#eef0f3;--metin:#14171c;--soluk:#5d6470;--cizgi:#d9dde3;
  --vurgu:#c62828;--y:#3d5ba9;--d:#b8336a;--n:#00838f;--c:#e07b12;--g:#5d6470;
  --uyari:#b45309;--uyari-bg:#fff4e0;--ok:#2e7d32;--isaret:#ffe08a;
  --golge:0 1px 3px rgba(0,0,0,.08);--r:12px;--ust:#fff;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1115;--yuz:#181b21;--yuz2:#22262e;--metin:#eceff3;--soluk:#9aa3af;--cizgi:#2e333c;
  --vurgu:#ef5350;--y:#7d9bf0;--d:#f06292;--n:#4dd0e1;--c:#ffa94d;--g:#9aa3af;
  --uyari:#ffb74d;--uyari-bg:#3a2a10;--ok:#81c784;--isaret:#7a5d00;--golge:none;--ust:#111;}}
:root[data-theme="dark"]{
  --bg:#0f1115;--yuz:#181b21;--yuz2:#22262e;--metin:#eceff3;--soluk:#9aa3af;--cizgi:#2e333c;
  --vurgu:#ef5350;--y:#7d9bf0;--d:#f06292;--n:#4dd0e1;--c:#ffa94d;--g:#9aa3af;
  --uyari:#ffb74d;--uyari-bg:#3a2a10;--ok:#81c784;--isaret:#7a5d00;--golge:none;--ust:#111;}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--metin);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;padding-bottom:env(safe-area-inset-bottom)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
.gizli{display:none!important}
/* ÜST */
header{position:sticky;top:0;z-index:20;background:var(--bg);padding:calc(8px + env(safe-area-inset-top)) 12px 6px;border-bottom:1px solid var(--cizgi)}
.ust{display:flex;gap:8px;align-items:center}
.arama{flex:1;position:relative}
.arama input{width:100%;height:46px;border-radius:23px;border:1.5px solid var(--cizgi);background:var(--yuz);padding:0 42px 0 42px;font-size:17px;outline:none}
.arama input:focus{border-color:var(--vurgu)}
.basfiltre::-webkit-search-cancel-button,.arama input::-webkit-search-cancel-button{display:none;-webkit-appearance:none}
.arama .ikon{position:absolute;left:14px;top:50%;transform:translateY(-50%);opacity:.55;pointer-events:none}
.arama .sil{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:none;width:36px;height:36px;border-radius:18px;font-size:20px;opacity:.6}
.ikonbtn{width:46px;height:46px;border-radius:23px;border:1.5px solid var(--cizgi);background:var(--yuz);font-size:20px;display:grid;place-items:center;flex:none}
.kat{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px}
.kat button{height:42px;border-radius:10px;border:1.5px solid var(--cizgi);background:var(--yuz);font-weight:600;font-size:15px;padding:0 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kat button[aria-pressed="true"]{color:var(--ust);border-color:transparent}
.kat button[data-k="y"][aria-pressed="true"]{background:var(--y)}
.kat button[data-k="c"][aria-pressed="true"]{background:var(--c)}
.kat button[data-k="n"][aria-pressed="true"]{background:var(--n)}
.kat button[data-k="d"][aria-pressed="true"]{background:var(--d)}
.serit{display:flex;gap:6px;align-items:center;margin-top:8px}
.serit .mercek{width:38px;height:38px;border-radius:19px;border:1.5px solid var(--cizgi);background:var(--yuz);flex:none;font-size:16px}
.cipler{display:flex;gap:6px;overflow-x:auto;scroll-snap-type:x proximity;scrollbar-width:none;flex:1;padding:2px 0;-webkit-overflow-scrolling:touch}
.cipler::-webkit-scrollbar{display:none}
.cip{scroll-snap-align:center;flex:none;height:38px;border-radius:19px;border:1.5px solid var(--cizgi);background:var(--yuz);padding:0 12px;font-size:14px;white-space:nowrap;display:flex;align-items:center;gap:6px}
.cip small{opacity:.6;font-size:11px}
.cip.aktif{border-color:var(--kr,var(--vurgu));background:var(--kr,var(--vurgu));color:var(--ust)}
.cip.arrest{border-color:var(--vurgu);color:var(--vurgu);font-weight:700}
.cip.arrest.aktif{color:var(--ust)}
.basfiltre{flex:1;height:38px;border-radius:19px;border:1.5px solid var(--vurgu);background:var(--yuz);padding:0 14px;outline:none}
/* İÇERİK */
main{max-width:1100px;margin:0 auto;padding:12px}
.kart{background:var(--yuz);border:1px solid var(--cizgi);border-radius:var(--r);box-shadow:var(--golge)}
.baslik{display:flex;align-items:center;gap:8px;margin:2px 0 10px}
.baslik h1{font-size:19px;margin:0;flex:1;line-height:1.25}
.kod{font-size:12px;font-weight:700;padding:2px 8px;border-radius:6px;color:var(--ust);background:var(--kr,var(--g));white-space:nowrap}
.yildiz{border:0;background:none;font-size:24px;width:42px;height:42px;color:var(--soluk)}
.yildiz[aria-pressed="true"]{color:#f5b301}
.sekme{display:flex;gap:6px;margin-bottom:8px}
.sekme button{flex:1;height:40px;border-radius:10px;border:1.5px solid var(--cizgi);background:var(--yuz);font-weight:600;font-size:14px}
.sekme button[aria-pressed="true"]{border-color:var(--kr);color:var(--kr)}
figure{margin:0;position:relative}
figure img{display:block;width:100%;height:auto;border-radius:var(--r);background:#fff;border:1px solid var(--cizgi);touch-action:pan-y pinch-zoom}
.ipucu{font-size:12px;color:var(--soluk);text-align:center;margin:6px 0}
.gezinti{display:flex;gap:8px;margin-top:8px}
.gezinti button{flex:1;min-height:44px;border-radius:10px;border:1.5px solid var(--cizgi);background:var(--yuz);font-size:14px;padding:4px 8px}
.ilgili{margin-top:12px}
.ilgili h2,.bolum h2{font-size:13px;text-transform:uppercase;letter-spacing:.04em;color:var(--soluk);margin:16px 0 8px}
.ilgili .liste{display:flex;flex-wrap:wrap;gap:6px}
.ilgili button{border:1.5px solid var(--cizgi);background:var(--yuz);border-radius:18px;padding:7px 12px;font-size:14px}
.sayfano{font-size:12px;color:var(--soluk)}
/* ANA EKRAN */
.hizli{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.hizli button{min-height:56px;border-radius:var(--r);border:0;font-weight:700;font-size:16px;color:#fff}
.hizli .arr{background:var(--vurgu);grid-column:1/-1;font-size:18px;min-height:64px}
.hizli .ara{background:var(--yuz);color:var(--metin);border:1.5px solid var(--cizgi)}
.satirlar{display:flex;flex-direction:column}
.satir{display:flex;align-items:center;gap:10px;padding:12px 12px;border:0;border-bottom:1px solid var(--cizgi);background:none;text-align:left;width:100%;min-height:52px}
.satir:last-child{border-bottom:0}
.satir .kod{flex:none}
.satir span.t{flex:1}
.satir .ok{opacity:.4}
.bos{color:var(--soluk);font-size:14px;padding:12px}
.uyarisatir{font-size:12px;color:var(--soluk);text-align:center;margin:18px 8px 8px}
/* ARAMA */
mark{background:var(--isaret);color:inherit;border-radius:3px;padding:0 1px}
.sonuc{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid var(--cizgi);background:none;padding:12px}
.sonuc:last-child{border-bottom:0}
.sonuc .ust2{display:flex;gap:8px;align-items:center;margin-bottom:4px;font-weight:600}
.sonuc .oz{font-size:14px;color:var(--soluk);line-height:1.4}
.filtreler{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.filtreler button{border:1.5px solid var(--cizgi);background:var(--yuz);border-radius:16px;padding:5px 12px;font-size:13px}
.filtreler button[aria-pressed="true"]{background:var(--metin);color:var(--bg);border-color:var(--metin)}
/* MENÜ */
.ortu{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:40}
.cekmece{position:fixed;top:0;right:0;bottom:0;width:min(340px,88vw);background:var(--yuz);z-index:41;overflow-y:auto;padding:calc(12px + env(safe-area-inset-top)) 0 20px;box-shadow:-4px 0 20px rgba(0,0,0,.2)}
.cekmece h3{margin:6px 16px 10px;font-size:13px;color:var(--soluk);text-transform:uppercase;letter-spacing:.05em}
.mo{display:flex;align-items:center;gap:12px;width:100%;border:0;background:none;padding:13px 16px;text-align:left;font-size:16px;min-height:50px;text-decoration:none}
.mo:active{background:var(--yuz2)}
.mo .e{width:26px;text-align:center;font-size:19px}
.mo .s{margin-left:auto;font-size:13px;color:var(--soluk)}
.ayrac{height:1px;background:var(--cizgi);margin:8px 0}
.durum{font-size:13px;color:var(--soluk);padding:4px 16px 10px}
/* PANEL (araçlar) */
.panel{position:fixed;inset:0;z-index:50;background:var(--bg);overflow-y:auto;padding:calc(10px + env(safe-area-inset-top)) 12px calc(24px + env(safe-area-inset-bottom))}
.panel .pb{display:flex;align-items:center;gap:8px;position:sticky;top:-10px;background:var(--bg);padding:6px 0 10px;z-index:2}
.panel .pb h2{flex:1;margin:0;font-size:20px}
.ic{max-width:760px;margin:0 auto}
.alan{display:flex;flex-direction:column;gap:4px;margin-bottom:12px}
.alan label{font-weight:600;font-size:14px}
.alan .ac{font-size:12px;color:var(--soluk);font-weight:400}
.alan input,.alan select{height:50px;border-radius:10px;border:1.5px solid var(--cizgi);background:var(--yuz);padding:0 14px;font-size:20px;outline:none;width:100%}
.alan input:focus,.alan select:focus{border-color:var(--vurgu)}
.alan input.hata{border-color:var(--vurgu);background:color-mix(in srgb,var(--vurgu) 8%,var(--yuz))}
.iki{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kg{font-size:30px!important;height:62px!important;font-weight:700;text-align:center}
.bilgi{font-size:13px;color:var(--soluk);background:var(--yuz2);border-radius:10px;padding:10px 12px;margin:8px 0 12px}
.uyari{background:var(--uyari-bg);color:var(--uyari);border-radius:10px;padding:10px 12px;font-size:14px;margin:8px 0;font-weight:600}
.grup{margin:14px 0 6px;font-size:14px;font-weight:700;display:flex;gap:8px;align-items:center}
.grup button{border:0;background:none;color:var(--kr);text-decoration:underline;font-size:13px;padding:0;margin-left:auto}
.doz{padding:12px;border-bottom:1px solid var(--cizgi)}
.doz:last-child{border-bottom:0}
.doz .ad{font-weight:700;font-size:16px}
.doz .yol{font-size:13px;color:var(--soluk)}
.doz .sonucd{font-size:24px;font-weight:800;margin:4px 0;font-variant-numeric:tabular-nums}
.doz .sonucd small{font-size:14px;font-weight:600;color:var(--soluk)}
.doz .sinir{font-size:13px;color:var(--uyari);font-weight:600}
.doz .belge{font-size:12.5px;color:var(--soluk);margin-top:4px}
.doz .belge button{border:0;background:none;color:var(--kr);padding:0;font-size:12.5px;text-decoration:underline}
.doz .infbtn{margin-top:6px;border:1.5px solid var(--cizgi);background:var(--yuz2);border-radius:8px;padding:6px 10px;font-size:13px}
.sonuclar{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}
.sonuclar div{background:var(--yuz);border:1px solid var(--cizgi);border-radius:10px;padding:10px}
.sonuclar b{display:block;font-size:22px;font-variant-numeric:tabular-nums}
.sonuclar span{font-size:12px;color:var(--soluk)}
.sonuclar .ana{grid-column:1/-1;border-color:var(--vurgu)}
.sonuclar .ana b{font-size:30px;color:var(--vurgu)}
.dugmeler{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 12px}
.dugmeler button{border:1.5px solid var(--cizgi);background:var(--yuz);border-radius:18px;padding:7px 12px;font-size:13px}
.dugmeler button[aria-pressed="true"]{background:var(--metin);color:var(--bg);border-color:var(--metin)}
/* KPR */
.kpr .saat{font-size:56px;font-weight:800;text-align:center;font-variant-numeric:tabular-nums;margin:4px 0}
.kpr .dongu{font-size:22px;text-align:center;font-weight:700;padding:14px;border-radius:var(--r);background:var(--yuz);border:2px solid var(--cizgi);font-variant-numeric:tabular-nums}
.kpr .dongu.alarm{background:var(--vurgu);color:#fff;border-color:var(--vurgu);animation:yanip 1s infinite}
@keyframes yanip{50%{opacity:.6}}
.kpr .izgara{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.kpr .izgara button{min-height:70px;border-radius:var(--r);border:2px solid var(--cizgi);background:var(--yuz);font-size:17px;font-weight:700;padding:6px}
.kpr .izgara button small{display:block;font-weight:500;font-size:13px;color:var(--soluk)}
.kpr .izgara .bas{grid-column:1/-1;background:var(--ok);color:#fff;border:0;font-size:20px}
.kpr .izgara .bas.dur{background:var(--metin);color:var(--bg)}
.adr-yesil{border-color:var(--ok)!important}
.adr-kirmizi{border-color:var(--vurgu)!important;background:color-mix(in srgb,var(--vurgu) 12%,var(--yuz))!important}
.kayit{font-size:14px;font-variant-numeric:tabular-nums;margin-top:10px}
.kayit div{padding:6px 2px;border-bottom:1px solid var(--cizgi)}
/* YAKINLAŞTIRMA */
.zoom{position:fixed;inset:0;z-index:60;background:#000;display:flex;flex-direction:column}
.zoom .zalan{flex:1;overflow:auto;touch-action:none;-webkit-overflow-scrolling:touch}
.zoom .zalan>*{display:block;transform-origin:0 0}
.zoom .zbar{display:flex;gap:6px;justify-content:center;padding:8px 8px calc(8px + env(safe-area-inset-bottom));background:#111}
.zoom .zbar button{min-width:52px;height:46px;border-radius:23px;border:0;background:#2a2a2a;color:#fff;font-size:18px;padding:0 12px}
.zoom .zkapat{position:absolute;top:calc(10px + env(safe-area-inset-top));right:10px;width:46px;height:46px;border-radius:23px;border:0;background:rgba(40,40,40,.85);color:#fff;font-size:22px;z-index:2}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--metin);color:var(--bg);padding:10px 16px;border-radius:20px;font-size:14px;z-index:90;max-width:90vw;text-align:center}
@media (min-width:900px){ main{padding:16px 20px} .baslik h1{font-size:22px} figure img{width:auto;max-width:100%;max-height:calc(100vh - 200px);margin:0 auto} }
</style>
</head>

STANE ÖNCESİ ACİL TIBBİ YARDIM VE\nBAKIM AKIŞ ŞEMALARI\nHastane öncesi acil sağlık hizmetlerinde kullanılan algoritmalar; güncel bilimsel veriler, ulusal ve uluslararası\nkılavuzlar ile saha gereksinimleri esas alınarak hazırlanmış olup, hasta değerlendirme ve müdahale süreçlerinde\nuygulayıcılara rehberlik eden yardımcı araçlar niteliğindedir. Söz konusu algoritmalar; Acil Tıp Teknikerleri,\nAcil Tıp Teknisyenleri, Sağlık Komuta Kontrol Merkezi (SKKM) hekimleri ve çağrı yönlendiriciler tarafından\nkullanılır.\nAlgoritmalar, bağlayıcı ve kesin talimat niteliği taşımamakta olup, tüm klinik durumları ve olası tıbbi varyasyonları\nkapsamayabilir. Bu nedenle uygulayıcılar; her somut olayın özelliklerini gözeterek mesleki bilgi, deneyim ve\nklinik değerlendirmeleri doğrultusunda karar vermekle yükümlüdür.\nUygulayıcılar, ayrıca yürürlükteki mevzuat hükümlerine uygun hareket etmek, güncel bilimsel gelişmeleri\nve kabul görmüş kılavuzları takip etmekle sorumludur. Algoritmaların uygulanması sırasında doğabilecek\nsonuçlara ilişkin sorumluluk, ilgili mevzuat çerçevesinde uygulayıcılara aittir.","KISALTMALAR Hastane Öncesi Tıbbi Acil ve\nBakım Algoritmaları\nSKKM : Sağlık Komuta Kontrol Merkezi DKB : Diyastolik Kan Basıncı\nÇM : Çağrı Merkezi AKS : Akut Koroner Sendrom\nNEA : Nabızsız Elektriksel Aktivite MI : Miyokard Infarktüsü\nVF : Ventriküler Fibrilasyon SVT : Supraventriküler Taşikardi\nVT : Ventriküler Taşikardi KKY : Konjestif Kalp Yetmezliği\nnVT : Nabızsız Ventriküler Taşikardi ST : ST Segmenti\nOED : Otomatik Eksternal Defibrilatör QRS : QRS Segmenti\nKPR : Kardiyopulmoner Resüsitasyon AV : Atriyoventriküler\nSpO : Oksijen Satürasyonu IV : İntravenöz (damar içi)\nKAH : Kalp Atım Hızı IO : İntraosseöz (kemik içi)\nNIMV : Non-İnvaziv Mekanik Ventilatör IM : İntramuskuler (kas içi)\nBVM : Balon Valv Maske SL : Sublingual (dil altı)\nPBV : Pozitif Basınçlı Ventilasyon DAKŞ : Damaryolu açık kalacak şekilde\nCPAP : Sürekli Pozitif Havayolu Basıncı KŞ : Kan Şekeri\nVYA : efleri:\nKapiller geri dolum zamanı < 2 sn olması; periferal ve santral nabızlar\narasında fark olmaması, normal nabızların varlığı; sıcak ekstremitelerin\nvarlığı; idrar çıkışının 1 ml/kg/ saat olması; bilincin normale veya hastanın\nönceki düzeyine dönmesi; yaşa göre normal kan basıncı değerleri\nvarlığı; glikoz değerinin normal olması; düzelme yok ya da yetersiz ve\nkalp yetmezliği bulgusu yoksa serum fizyolojik ile yüklemeyi 3 defa\nyap (toplam 60 ml/kg); üç yüklemeye yanıt alınamadıysa veya yükleme\nsırasında kalp yetmezliği geliştiyse inotrop başla.\nKalp Yetmezliği Bulguları:\nAkciğer oskültasyonunda bilateral krepitan ral; ronküs; gode bırakan\nödem; kalp oskültasyonunda gallop ritmi","Septik Şok\nAnahtar Noktalar\nHastane Öncesi Kullanımda ADRENALİN İnfüzyonu İçin Pratik Doz Hesaplama\n500 ml % 0,9 NaCl içine 1 mg Adrenalin ampul konulur. Dakikada çocuk / bebeğin kilosu kadar damla gönderilmeye başlandığında 0,1 mcg/kg/dk infüzyon\nuygulanmaya başlanmış demektir. Bu pratik doz hesabının akılda kalması için \"YARIM-TAM-TAM\" hatırlatması da kullanılabilir. 1000 ml % 0,9 NaCl nin yarısı 500\nml, 1 mg Adrenalin ampul, çocuk / bebeğin kilosu kadar damla\nHastane Öncesi Kullanımda DOPAMİN İnfüzyonu İçin Pratik Doz Hesaplama\n500 ml % 0,9 NaCl içine 100 mg Dopamin ampul konulur (Dopamin ampul 200 mg); dakikada çocuğun / bebeğin kilosunun yarısı kadar damla gönderildiğinde\n5 mcg/kg/dk infüzyon uygulanmaya başlanmış olur. Bu pratik doz hesaplamasının akılda kalması için \"YARIM-YARIM-YARIM\" hatırlatması da kullanılabilir. 1000\nml % 0,9 NaCl nin yarısı 500 ml % 0,9 NaCl; 200 mg 1 ampul Dopaminin yarısı: 100 mg çocuk / bebeğin kilosunun yarısı kadar damla\nÇocuk / bebeklerde adrenalin ilk tercih vazoaktif ajandır. Adrenalinin temin edilemediği veya kullanılamadığı durumlarda dopamin infüzyonu alternatif olarak\ndüşünülebilir\nSEPTİK ŞOK Sıvı replasmanına rağmen hipotansiyonun devam ettiği (dirençli\nhipotansiyon) ve diğer bilinen nedenler dışında organ disfonksiyonu ve\nperfüzyon anormalliğinin görüldüğü durumdur (oligüri varlığı gibi). Tanıya\nqSOFA skoru yardımcıdır\nqSOFA SKORU\n1 PUAN 0 PUAN\nSolunum sayısı > 22 /dk Evet Hayır\nMental durum değişikliği Evet Hayır\nSKB ≤ 100 mmHg Evet Hayır\n> 2 puan olduğunda kötü sonlanım ile ilişkilidir","Septik Şok\nSB-ASH-Ç-09\nAcil olgu yönetimini uygula\nHava yolu yönetimini sağla\nSpO % 94-98 aralığında olacak şekilde oksijen vermeye başla\n(Solunum sıkıntısı artan, bilinci kapanan hastalarda ileri hava yolu\nuygulamalarını düşün)\nMonitörize et, damar yolu aç, kan şekeri ölç, hipoglisemi varsa\ndüzelt, vücut ısısını ölç, hastayı hipo/hipertermiden koru\nDamar yolu aç (IV yol 90 sn de açılamazsa IO yolu aç)\n20 ml/kg % 0,9 NaCl IV (Yenidoğanlarda 10 ml/kg) 5 - 10 dk da gidecek\nşekilde vermeye başla\nİlk sıvı tedavisine yanıt alınamazsa aynı miktarda sıvıyı ikinci veya üçüncü\nkez tekrarla (Toplam 60 ml/kg; yenidoğanda toplam 30 ml/kg)\nSeptik şokta verilen sıvının damar Sıvı tedavisine rağmen şok bulguları düzelmezse ADRENALİN IV\ndışına çıkma riski olduğundan hastayı 0,1 - 0,3 mcg/kg/dk ya da DOPAMİN IV 5 - 20 mcg/kg/dk infüzyon başla\nboluslar arası yüklenme bulguları\naçısından (Akciğerlerde raller, ronküs,\ntaşikardi, hepatomegali) değerlendir\nAntibiyotik tedavisine erken başlanabilmesi için hızla nakil sağla","Bradikardi\nAnahtar Noktalar\nAdrenalin 1 / 10.000 Çözelti Hazırlanması ve Uygulanması\nAdrenalin 1 mg 1 ml (1/1000) + 9 ml SF = 10 ml (1/10.000)\nAdrenalin 0,5 mg 1 ml (1/2000) + 4 ml SF = 5 ml (1/10.000)\nAdrenalin 0,25 mg 1 ml (1/4000) + 1,5 ml SF = 2,5 ml (1/10.000)\n1/10.000 lik hale getirilmiş adrenalin solüsyonundan 0,1 ml/kg uygulanır (kilo başına 1 dizyem)\nÇocuklarda İstirahat Halindeki Normal Kalp Hızı Değerleri ( Atım / dk )\nYaş En düşük - En yüksek değer\n1 - 12 ay 100 - 160\n1 - 3 yaş 90 - 150\n3 - 5 yaş 80 - 140\n6 - 12 yaş 70 - 120\n> 12 yaş 60 - 100\nBradikardi Nedenleri\nHipoksi, hipotermi, kalp blokları, kafa içi basınç artışı, aşırı vagal uyarı"," z IV puşe\nşekeri takibine devam et\n% 5 lik dekstroz 2,5-5 ml/kg/saat\nidame IV sıvı başla","Anafilaksi Anahtar Noktalar\nAnafilaksi Tanı Kriterleri\nCildin ve/veya mukozanın (yaygın ürtiker, kaşıntı, kızarıklık, şiş dudaklar, dil veya uvula) tutulduğu, ani başlangıçlı, hastalığa eşlik\neden;\nAşağıdakilerden en az birisinin görülmesi:\n• Solunum bulguları (dispne, stridor, hışıltı, bronkospazm veya hipoksemi)\n• Azalmış kan basıncı veya dolaşım bozukluğu ile ilişkili bulgular (hipotoni, senkop veya inkontinans)\nVEYA muhtemel bir alerjen ile temastan kısa bir süre sonra aşağıdakilerden 2 veya daha fazlasının görülmesi:\n• Deri ve mukoza tutulumu (yaygın ürtiker, kaşıntı, kızarıklık, şiş dudaklar, dil veya uvula)\n• Solunum bulguları (dispne, hışıltı, bronkospazm, stridor, hipoksemi)\n• Azalmış kan basıncı veya dolaşım bozukluğu ilişkili bulgular (hipotoni, senkop veya inkontinans)\n• Gastrointestinal bulgular (kramp şeklinde karın ağrısı veya kusma)\nVEYA\n• Hasta için alerjen olduğu bilinen madde ile temas sonrasında HİPOTANSİYON veya sistolik kan basıncında % 30 dan fazla düşme","Anafilaksi\nSB-ASH-Ç-21\nAcil olgu yönetimini uygula, mümkünse alerjeni\nuzaklaştır\nHava yolu açıklığını sağla\nSpO % 94-98 aralığında olacak şekilde oksijen vermeye başla\nSolunum sıkıntısı varsa\nSalbutamol 0,15 mg/kg nebül\nuygula (20 dk arayla 3 kez) Anafilaksi tanısı konduğu anda; ADRENALİN 1/1000 solüsyon 0,01 mg/kg\nIM (0,01 ml/kg) 12 yaş altı maks 0,3 mg IM, 12 yaş üstü maks 0,5 mg IM (IM\nuygulama için uyluk bölgesi kullanılmalı) Yeterli cevap alınamazsa 5-15 dk\narayla toplam 3 doza kadar çıkılabilir\nMonitörize et, damar yolu aç\nAnjioödem varsa erken ileri hava\nyolu uygulaması planla (Entübasyon\nyapılamıyorsa krikotirotomiyi düşün)\n% 0.9 NaCl IV bolus (20 ml/kg) yükleme yap\nAntihistaminik uygula\nDİFENHİDRAMİN IV 1 mg/kg veya FENİRAMİN MALEAT IV 1 mg/kg\n(maks: 50 mg)\nGeç reaksiyonların ortaya çıkmasının önlenmesi için\nMETİL PREDNİZOLON 1 - 2 mg/kg IV veya IM uygula (maks: 125 mg)","Hipertermi Anahtar Noktalar\nKas seyirmeleri, alt ekstremiteler ve abdomende ağrılı\nIsı Krampları\nspazmlar, bulantı, kusma, güçsüzlük ve aşırı terleme durumu\nSolukluk, yoğun terleme, ortostatik hipotansiyon, baş ağrısı,\nIsı Yorgunluğu\ngüçsüzlük, bitkinlik ve susuzluk\nBilinç durumunda değişiklik, beden ısısında artış, minimal ya da\nIsı Çarpması\nçok az terleme, kollaps, şok, nefes darlığı, bulantı ve kusma\nHipertermi Hastane Öncesi Müdahale Sınırı\n> 39 °C ise Müdahaleye başlanmalı\n> 40 °C ise Aktif soğutma mutlaka başlanmalı\nPotansiyel ısı çarpması (heat strike); riski acil soğutma ve ileri\n> 41 °C ise\nyaşam desteği gerekir\nPasif Eksternal Soğutma Yöntemleri\nHastanın üzeri çıkartılır. Vücudu soğuk ya da ılık su ile ıslatılır ve\nEvoperasyon\nhavalandırma açılarak buharlaşması sağlanır\nHastanın koltuk altı ve kasık bölgelerine ıslak bez ya da spanç\nİmmersiyon\nkonulur\nSoğutmada hedef vücut ısısı < 39 °C yi sağlamaktır. Aşırı soğutma yapılarak hipotermiye neden olmaktan kaçınılmalıdır","Hipertermi\nSB-ASH-Ç-22\nAcil olgu yönetimini uygula\nVücut ısısını ölç, vücut ısısı > 40 °C ise\nVücut ısısı < 39 °C olacak şekilde\nHastayı serin ortama al\nKıyafetlerini çıkar\nAmbulans kabinini soğut\nTermal battaniyeyi sarı kısım içte kalacak şekilde ört\nMonitörize et, damar yolu aç\nSpO % 94-98 olacak şekilde O vermeye başla\n2 2\n% 0,9 NaCl IV hidrasyon (20 ml/kg) başla\nBilinç değişikliği ve şok bulguları varsa Bilinç değişikliği yoksa\nHİPOVOLEMİK ŞOK ALGORİTMASINA GİT Ağızdan sıvı ver","Hipotermi Anahtar Noktalar\nIsıtma Yöntemleri Kullanılan Teknik\nPasif Isıtma Islak giysilerin çıkartılması, battaniye, termal alüminyum örtü\nIsıtma cihazları, sıcak su paketleri, kimyasal ısı paketleri, ısıtılmış\nnemlendirilmiş oksijen (42-46 °C), ısıtılmış IV sıvılar\n(40 - 42 °C) (Bilinç değişikliği olan orta ve ciddi hipotermide\nAktif Dış Isıtma\ndüşünülmeli)\n(Sadece ekstremite ısıtılırsa hastadaki şok bulguları\nderinleşebilir)\nSınıflandırma Vücut Isısı Belirtiler\n1. Seviye Ilımlı Hipotermi 35 - 32 °C Bilinç açık, titreme mevcut\n2. Seviye Orta Hipotermi 32 - 28 °C Bilinç bozulmaya başlamış, titreme yok\nBilinçsiz, vital bulgular alınabiliyor, kardiyak arrest ya da çok\n3. Seviye Ciddi Hipotermi 28 - 24 °C\nzayıf dolaşım durumu, vital bulgular yok ya da minimal","Hipotermi\nSB-ASH-Ç-23\nAcil olgu yönetimini uygula\nMonitörize et\nSoğuk çevreden uzaklaştır, ıslak veya soğuk kıyafetleri çıkar, ısı kaybını engelle\nNabız var Nabız yok\nIlık oksijen ver, ılık % 0,9 NaCl IV\nHİPOTERMİDE ARREST\ninfüzyonu (45 °C yi geçmemeli) başla\nYÖNETİMİ\nALGORİTMASINA GİT\nBaş-boyun-koltukaltı-kasık bölgelerine\nılık su paketleri koy, termal battaniye\n(sarı kısım dışarıda olacak şekilde) ile sar,\nbilinç açıksa ılık içecekler ver\nYeniden ısıtma\nsırasında huzursuzluk,\nağrı ve ajite durum\n< 32 °C aktif dış ısıtma uygulamaları\nvarlığında analjezik\nyap < 32 °C altında sarsıntılar kardiyak\ndüşün\naritmileri tetikleyebileceği için transport\nesnasında hastayı fazla hareket ettirme\nYakın vital bulgu ve kan şekeri takibi yap","Hipotermide Arrest Yönetimi\nAnahtar Noktalar\nHipotermik Arrest Durumlarında Dikkat Edilecek Noktalar\nIslak giysileri çıkar, battaniye ya da termal örtü ile ört, sıcak ortama al, uygulamalarda sert fiziksel hareketlerden kaçın\nVücut ısısını takip et, nabzı uzun süre değerlendir (en az 60 sn)\nCiddi hipotermide kan basıncının ölçülememesi, ağrılı uyarana yanıt olmaması ve pupil refleksinin kaybı ölüm belirtisi değildir\nIsıtma Yöntemleri Kullanılan Teknik KPR Endikasyonu Olmayan Durumlar\nIslak giysilerin çıkarılması, battaniye,\nPasif Isıtma Hava yolunun karla buzla kaplı olması\ntermal alüminyum örtü\nBilinç değişikliği olan orta ve ciddi\nhipotermide; ısıtma cihazları, sıcak\nsu paketleri, sıcak banyo, kimyasal\nAktif Dış Isıtma 35 dk dan fazla çığ altında kalma\nısı paketleri, ısıtılmış nemlendirilmiş\noksijen (42-46 °C), ısıtılmış IV sıvılar\n(40-42 °C)\nOrtam güvenliğinin sağlanmamış olması\nKardiyak kompresyona izin vermeyecek şekilde bütün vücudun\ndonması\nHipotermik Arrest Durumlarında Dikkat Edilecek Noktalar\nVakaya özel hazırlık olarak ambulans kabinini ve serumları ısıt\nNabız monitör ile birlikte en az 60 sn değerlendirilmeli\nBradiaritmi durumunda öncelikle ısıtma uygulanmalıdır\nDamar yolu açıldığında verilecek sıvıların ılık (yaklaşık 40-42 °C) olmasına özen gösterilmeli","Hipotermide\nArrest Yönetimi\nSB-ASH-Ç-24\nAcil olgu yönetimini uygula\nMonitörize et, 60 sn süre ile solunum ve\ndolaşımı kontrol et, vücut ısısını ölç\nNabız yoksa KPR uygula\nVücut ısısı < 30 °C ise,\nritmi değerlendir\nŞoklanır ritim ise, KPR\nRitim NEA / asistoli ise,\nyi sürdür. Defibrilasyonu\nKPR yi sürdür vücut ısısı\nen çok 1 kez dene, vücut\n30 °C üstüne çıkana\nısısı 30 °C üstüne çıkana\nkadar ilaç uygulaması\nkadar ilaç\nyapma\nuygulaması yapma\nKPR > 35 °C oluncaya kadar devam ettir\nVücut ısısı > 35 °C olunca olunca;\nArrest yönetimi sırasında pasif ısıtma ve/veya aktif dış ısıtma\nuygulamaları yap\nVücut ısısı >35 °C olana kadar\nadrenalin uygulama aralıkları\nuzatılabilir\nARREST YÖNETİMİ ALGORİTMASINA GİT","Isırma ve Sokmalar\nSB-ASH-Ç-25\nSB-ASH-Ç-25\nAcil olgu yönetimini uygula\nIsıran veya sokan etkeni belirle\nKara canlıları Isırılan yeri tespit et, yara izini değerlendir Deniz canlıları\nIsırılan bölgeye lokal Yıka ve sabitle Isırılan bölgeyi lokal % 0,9 NaCl ile\nsoğuk uygula irrigasyon yap\nHer 5 dk da bir ödemin sınırını izle\nAlerjik reaksiyon /\nHastanın vitallerini takip et, zehirlenme alerjik\nanafilaksi varsa\nreaksiyon ve anafilaksi bulgularını gözlemle\nİLGİLİ ALGORİTMAYA GİT\nHipotansiyon varlığında % 0,9 NaCl IV hidrasyon başla\nYılan ya da akrep ısırıklarında turnike\nArı sokmalarında Solunum yolu, kan yolu ve\nuygulanmamalıdır. Turnike yerine\niğne görülüyorsa vücut sıvıları ile bulaş olabildiği\nsıkma bantları ya da sıkı bandaj\nçıkarılmalıdır için koruyucu ekipman\nuygulanmalıdır. Bunu sağlamak için\nkullanımına dikkat edilmeli\nbir parmağın rahatlıkla girebileceği\ngevşeklikte uygulama yapılmalıdır","Suda Boğulma Anahtar Noktalar\nDikkat Edilecekler\nSağlık personeli suya girmeden at-çek-uzat protokolü ile hastayı sudan çıkarmalıdır. Bu yöntem ile hasta sudan çıkarılamamışsa\nprofesyonel yardım çağırılır\nBilinci kapalı ya da travma şüphesi (sığ suya dalma / atlama, su sporu kazaları vb.) varlığında spinal stabilizasyonu sağlanmalıdır\nSudan çıkarıldıktan sonra hastanın ıslak kıyafetleri çıkarılmalı, kurulanmalı ve hipotermiden korunmalıdır","Suda Boğulma\nSB-ASH-Ç-26\nKendi güvenliğini sağla\nHasta sudan çıkarılmış mı? KONU İLE İLGİLİ ANAHTAR\nNOKTALARA BAKINIZ\nVücut ısısı < 35 °C ise Acil olgu yönetimini uygula\nHİPOTERMİ Hava yolu güvenliği, oksijenizasyon Travma şüphesi varsa\nALGORİTMASINA GİT ve ventilasyonu sağla\nSpinal stabilizasyon\nSolunum yoksa/gasping solunum ise sağla\n5 kurtarıcı soluk ver\nARREST YÖNETİMİ\nALGORİTMASINA GİT\nHayır\nEvet","Yanık Anahtar Noktalar\nYanık Merkezine Transfer\nParsiyel kalınlık > %20 VYA (Vücut Yüzey Alanı) Ekstremiteyi çepeçevre saran yanıklar\nParsiyel kalınlık > %10 VYA İnhalasyon yaralanmasıyla birlikte olan yanıklar\nTam kat yanık > % 5 VYA Elektrik yanıkları, Kimyasal yanıklar\nEl, yüz, ayak, perine yanıkları Kırık veya başka travmayla birlikte olan yanıklar\nMajor eklemleri içeren yanıklar Yüksek risk grubunda olan hastalardaki yanıklar\nÇocuklarda Yanık Durumlarında Sıvı Resüsitasyonu Formülü\nSaatlik başlangıç sıvı resüsitasyonu formülü: (3 ml x yanmış VYA x kg)/16, elektrik yanıkları için (4 ml x yanmış VYA x kg)/16\nİnfant ve küçük çocuklar, 30 kg altı için, Ringer Laktat ile birlikte verilmelidir\nİdrar çıkışı takibine (1 ml/kg/sa) göre sıvı miktarı saatlik olarak %10-30 oranında artırılmalı veya azaltılmalıdır\nHastanın avuç içi (parmaklar dahil) kendi vücut yüzeyinin yaklaşık %1 ine denk gelir\nÇocukların geniş alanları içeren major yanıklarında musluk suyu ile yıkama çocukları hipotermiye sokabileceği (Sadece yanık alanı\nsoğutulmalı, hastanın geri kalanı sıcak tutulmalıdır. % 10 ve üzeri yanık alanı olan çocuklarda soğutma yapılmamalıdır)","Yanık Anahtar Noktalar\nLUND – BROWDER ŞEMASI\nYAŞ 0 1 5 10 15 Erişkin\nÖn veya Arka (%) (%) (%) (%) (%) (%)\nYarı\nI (Baş) 9½ 8½ 6½ 5½ 4½ 3½\nII (Uyluk) 2¾ 3¼ 4 4¼ 4½ 4¾\nIII (Bacak) 2½ 2½ 2¾ 3 3¼ 3½\nT.C. Sağlık Bakanlığı Sağlık Hizmetleri\nGenel Müdürlüğü. (2012).\nYanık tedavi algoritması.","Yanık\nSB-ASH-Ç-27\nAcil olgu yönetimini uygula\nSolunum sıkıntısı varsa, hava yolunu açık tut, oksijenizasyon ve\nventilasyonu destekle. İnhalasyon yanığı veya boyunda sirküler yanık\nvarsa erken ileri hava yolu uygulaması düşün\nYanık bölgesindeki giysileri çıkart (Deri ve doku kaldırılmamalı, soyulmamalıdır)\nAvuç içi kuralı kullanarak yanığın alanını ve derecesini değerlendir\nYanık yüzeyini steril yanık örtüsü veya steril pansuman ile ört\nVücut üzerindeki\nmetal ve takıları\nçıkar!\nAğrıyı değerlendir, yakın vital bulgu takibi yap\nAğrı kontrolü için ANALJEZİK/FENTANİL\nFentanil için: 1 mcg/kg IV yavaş infüzyon, IM, SC\nHİPOVOLEMİK ŞOK Evet Hipovolemik şok Hayır Sıvı\nALGORİTMASINA GİT bulguları var mı? yüklemesi yap\nYanık merkezi/ünitesi olan merkeze nakil için\nSKKM/ÇM ile iletişime geçilmelidir.\nSB-ASH-Ç-27\nYanık boyutuna göre sıvı yüklemesi yap\n(3 ml x yanmış VYA x kg)/16 Ringer Laktat","Toksikoloji-Zehirlenme\nSB-ASH-Ç-28\nDoz Aşımı\nSB-ASH-Ç-28\nAcil olgu yönetimini uygula\nMaddeyi tanımla ve maddenin\nuzaklaştırıldığından emin ol\nSpO % 94-98 aralığında olacak şekilde oksijen vermeye başla,\ngerekirse solunumu PBV ile destekle\nAritmi varsa UYGUN RİTİM\nMonitörize et BOZUKLUĞU ALGORİTMASINA GİT\nDolaşım bozukluğu\nbulguları varsa HİPOVOLEMİK ŞOK\nDamar yolu aç ALGORİTMASINA GİT\nNormal sınırlar\ndışındaysa HİPO/HİPERGLİSEMİ\nKan şekerini ölç ALGORİTMASINA GİT\nAnormal bulgu varsa\nHipotermi ve\nVücut ısısını ölç\nhipertermiden koru\nNöbet varsa\nOpioid zehirlenmesi şüphesi varsa Nörolojik değerlendirme yap (pupil NÖBET/KONVÜLZİYON\nNALOKSON 0,1 mg/kg IV/I const NMAP={'ç':'c','Ç':'c','ğ':'g','Ğ':'g','ı':'i','I':'i','İ':'i','ö':'o','Ö':'o','ş':'s','Ş':'s','ü':'u','Ü':'u','â':'a','Â':'a','î':'i','û':'u'};
function norm(s){let o='';for(const ch of s){let c=NMAP[ch];if(c===undefined){c=ch.toLowerCase();if(c.length!==1)c=ch;}if(!/[a-z0-9%.,]/.test(c))c=' ';o+=c;}return o;}

function terimler(q){
  let n=norm(q).trim();if(!n)return[];
  const gruplar=[];
  // çok kelimeli eşanlamlıları önce yakala
  for(const w of Object.keys(ESH).filter(w=>w.includes(' '))){if(n.includes(w)){gruplar.push(ESH[w]);n=n.replace(w,' ');}}
  for(const t of n.split(/\s+/).filter(Boolean)){
    const g=ESH[t]||Object.keys(ESH).filter(w=>t.length>=4&&w.startsWith(t)).flatMap(w=>ESH[w]);
    gruplar.push([...new Set([t,...(g||[])])]);
  }
  return gruplar;
}
function bul(txt,w,tam,ilk){const r=[];let i=txt.indexOf(w);while(i>=0){if(!tam||(!/[a-z0-9]/.test(txt[i-1]||' ')&&!/[a-z0-9]/.test(txt[i+w.length]||' '))){r.push(i);if(ilk||r.length>=20)break;}i=txt.indexOf(w,i+1);}return r;}
function eslesir(txt,gruplar){
  let puan=0,ilk=-1;
  for(const g of gruplar){let bulundu=false;
    g.forEach((w,j)=>{const tam=j>0&&w.length<=3;const r=bul(txt,w,tam);if(r.length){bulundu=true;puan+=r.length*(j===0?3:1);if(ilk<0||r[0]<ilk)ilk=r[0];}});
    if(!bulundu)return null;}
  return{puan,ilk};
}
function ozet(p,gruplar){
  const ham=VERI.metin[p-1],n=NT[p-1];
  const r=eslesir(n,gruplar);if(!r)return'';
  const bas=Math.max(0,r.ilk-60),son=Math.min(ham.length,r.ilk+140);
  const parca=ham.slice(bas,son),np=n.slice(bas,son);const e2=x=>esc(x).replace(/\n/g,' · ');
  // işaretle
  const araliklar=[];
  for(const g of gruplar)g.forEach((w,j)=>bul(np,w,j>0&&w.length<=3).forEach(i=>araliklar.push([i,i+w.length])));
  araliklar.sort((a,b)=>a[0]-b[0]);
  let o='',son2=0;for(const [a,b] of araliklar){if(a<son2)continue;o+=e2(parca.slice(son2,a))+'<mark>'+e2(parca.slice(a,b))+'</mark>';son2=b;}
  o+=e2(parca.slice(son2));
  return(bas>0?'… ':'')+o+(son<ham.length?' …':'');
}

/* ---------- YAKINLAŞTIRMA ---------- */
function zoomAc(p){
  const z=el('div',{class:'zoom',role:'dialog','aria-label':'Sayfa büyütme'});
  const alan=el('div',{class:'zalan'});
  const img=new Image();img.src=sayfaYol(p);img.alt='';
  let olcek=1,donuk=false,cizim=img;
  const kap=()=>{z.remove();removeEventListener('resize',boyut);if(history.state&&history.state.zoom){kapatSonra();history.back();}};
  function boyut(){
    const W=alan.clientWidth,H=alan.clientHeight;
    const iw=donuk?1406:1988,ih=donuk?1988:1406;
    const taban=Math.min(W/iw,H/ih);
    cizim.style.width=(iw*taban*olcek)+'px';cizim.style.height=(ih*taban*olcek)+'px';
  }
  function olcekle(yeni,cx,cy){
    yeni=Math.max(1,Math.min(6,yeni));
    const r=alan.getBoundingClientRect();cx=cx??r.width/2;cy=cy??r.height/2;
    const ox=(alan.scrollLeft+cx)/olcek,oy=(alan.scrollTop+cy)/olcek;
    olcek=yeni;boyut();alan.scrollLeft=ox*olcek-cx;alan.scrollTop=oy*olcek-cy;
  }
  function dondur(){
    donuk=!donuk;
    if(donuk){const c=document.createElement('canvas');c.width=1406;c.height=1988;const x=c.getContext('2d');x.translate(1406,0);x.rotate(Math.PI/2);x.drawImage(img,0,0);cizim.replaceWith(c);cizim=c;}
    else{cizim.replaceWith(img);cizim=img;}
    olcek=1;boyut();
  }
  // parmak hareketleri
  const pt=new Map();let d0=0,s0=1,son=0;
  alan.addEventListener('pointerdown',e=>{pt.set(e.pointerId,{x:e.clientX,y:e.clientY});alan.setPointerCapture(e.pointerId);
    if(pt.size===2){const[a,b]=[...pt.values()];d0=Math.hypot(a.x-b.x,a.y-b.y);s0=olcek;}
    else{const n=Date.now();if(n-son<300){olcekle(olcek>1.5?1:2.5,e.clientX-alan.getBoundingClientRect().left,e.clientY-alan.getBoundingClientRect().top);son=0;}else son=n;}});
  alan.addEventListener('pointermove',e=>{if(!pt.has(e.pointerId))return;const o=pt.get(e.pointerId);
    if(pt.size===1){alan.scrollLeft-=e.clientX-o.x;alan.scrollTop-=e.clientY-o.y;}
    pt.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(pt.size===2){const[a,b]=[...pt.values()];const d=Math.hypot(a.x-b.x,a.y-b.y);const r=alan.getBoundingClientRect();olcekle(s0*d/d0,(a.x+b.x)/2-r.left,(a.y+b.y)/2-r.top);}});
  const birak=e=>{pt.delete(e.pointerId);};
  alan.addEventListener('pointerup',birak);alan.addEventListener('pointercancel',birak);
  alan.addEventListener('wheel',e=>{e.preventDefault();const r=alan.getBoundingClientRect();olcekle(olcek*(e.deltaY<0?1.15:0.87),e.clientX-r.left,e.clientY-r.top);},{passive:false});
  alan.append(img);
  z.append(alan,el('button',{class:'zkapat','aria-label':'Kapat',on:{click:kap}},'✕'),
    el('div',{class:'zbar'},
      el('button',{'aria-label':'Küçült',on:{click:()=>olcekle(olcek/1.4)}},'−'),
      el('button',{'aria-label':'Sığdır',on:{click:()=>olcekle(1)}},'⤢'),
      el('button',{'aria-label':'Büyüt',on:{click:()=>olcekle(olcek*1.4)}},'+'),
      el('button',{'aria-label':'Döndür',on:{click:dondur}},'⟳ Döndür')));
  document.body.append(z);
  history.pushState({...(history.state||{}),zoom:1},'');
  z._kapat=()=>z.remove();
  const hazir=()=>{if(innerHeight>innerWidth&&!donuk)dondur();else boyut();};
  if(img.complete)hazir();else img.onload=hazir;
  addEventListener('resize',boyut);
}

const ONBELLEK='alg-sayfa-v1';
async function cevrimdisiHazirla(){
  const ad=$('#cevrimAd'),dt=$('#cevrimDetay');
  if(!('caches' in window)||!('serviceWorker' in navigator)){ad.textContent='Desteklenmiyor';return;}
  try{if(navigator.storage&&navigator.storage.persist)await navigator.storage.persist();}catch(e){}
  try{
    const c=await caches.open(ONBELLEK);
    const tum=[];for(let p=1;p<=VERI.sayfaSay;p++)tum.push(sayfaYol(p));
    const eksik=[];for(const u of tum){if(!(await c.match(u)))eksik.push(u);}
    let bitti=tum.length-eksik.length;
    const goster=()=>{ad.textContent=bitti===tum.length?'Hazır ✓':'%'+Math.round(bitti*100/tum.length);dt.textContent=bitti===tum.length?'Tüm şemalar telefonda; internetsiz çalışır.':'Şemalar indiriliyor: '+bitti+'/'+tum.length;};
    goster();
    for(let i=0;i<eksik.length;i+=6){
      await Promise.all(eksik.slice(i,i+6).map(async u=>{try{const r=await fetch(u,{cache:'no-cache'});if(r.ok){await c.put(u,r);bitti++;}}catch(e){}}));
      goster();
    }
    if(bitti<tum.length){ad.textContent='Eksik';dt.textContent=(tum.length-bitti)+' sayfa inmedi; internete bağlanınca menüden "Çevrimdışı"ya dokunun.';}
  }catch(e){ad.textContent='Hata';dt.textContent=String(e);}
}

/* sayı okuma: virgül ve nokta kabul */
function sayi(v){if(v==null)return NaN;v=String(v).trim().replace(/\s/g,'');if(!v)return NaN;if(/^\d{1,3}(\.\d{3})+(,\d+)?$/.test(v))v=v.replace(/\./g,'');v=v.replace(',','.');if(!/^-?\d*\.?\d+$/.test(v))return NaN;return parseFloat(v);}
function fmt(n,b){if(!isFinite(n))return'—';const a=Math.abs(n);const d=b!=null?b:(a>=1000?0:a>=10?1:a>=1?2:3);return n.toLocaleString('tr-TR',{maximumFractionDigits:d,minimumFractionDigits:0});}

/* ---------- DOZ HESAPLAYICI ---------- */
function dozAc(opt){
  let k=opt.alg?ALGID[opt.alg].k:(D.k);
  let filtre='';
  const kg=giris('dzkg','Hastanın kilosu (kg)','',KG??'',{class:'kg',placeholder:'kg'});
  const uy=el('div');
  const ara=el('input',{type:'search',placeholder:'İlaç veya algoritma ara (ör. adrenalin)',style:'height:44px;font-size:16px'});
  const katlar=el('div',{class:'dugmeler'});
  const liste=el('div');
  function katCiz(){katlar.innerHTML='';[['y','Yetişkin'],['c','Çocuk'],['n','Yenidoğan'],['d','Doğum']].forEach(([kk,ad])=>katlar.append(el('button',{'aria-pressed':k===kk,on:{click:()=>{k=kk;opt.alg=null;katCiz();hesap();}}},ad)));}
  function hesap(){
    const w=sayi(kg.i.value);KG=isFinite(w)?kg.i.value:null;
    kg.i.classList.toggle('hata',kg.i.value!==''&&!(w>0));
    uy.innerHTML='';
    if(w>0){
      if(w>200)uy.append(el('div',{class:'uyari'},'⚠️ '+fmt(w)+' kg çok yüksek. Kiloyu kontrol edin.'));
      else if((k==='c')&&w>80)uy.append(el('div',{class:'uyari'},'⚠️ Çocuk bölümü seçili ama kilo '+fmt(w)+' kg. Doğru bölüm mü?'));
      else if(k==='n'&&w>6)uy.append(el('div',{class:'uyari'},'⚠️ Yenidoğan için '+fmt(w)+' kg yüksek. Kiloyu kontrol edin.'));
      else if(k==='y'&&w<30)uy.append(el('div',{class:'uyari'},'⚠️ Yetişkin bölümü seçili ama kilo '+fmt(w)+' kg. Çocuk bölümünü mü kastettiniz?'));
    }
    liste.innerHTML='';
    const nf=norm(filtre).trim();
    let dz=DOZLAR.filter(d=>d.k===k);
    if(opt.alg)dz=DOZLAR.filter(d=>d.a===opt.alg);
    if(nf)dz=DOZLAR.filter(d=>norm(d.i+' '+d.y+' '+(ALGID[d.a]?ALGID[d.a].t:'')+' '+d.m).includes(nf)).sort((x,y)=>(x.k===k?0:1)-(y.k===k?0:1));
    if(!dz.length){liste.append(el('div',{class:'bilgi'},k==='d'&&!nf?'Doğum algoritmalarında kiloya bağlı doz yok; dozlar sabit olarak şemalarda yazılıdır.':'Eşleşen doz yok.'));return;}
    let onceki=null,kart=null;
    for(const d of dz){
      if(d.a!==onceki){const a=ALGID[d.a];onceki=d.a;
        liste.append(el('div',{class:'grup',style:'--kr:'+KATRENK[a.k]},el('span',{class:'kod',style:'--kr:'+KATRENK[a.k]},a.kod||KATAD[a.k]),a.t,el('button',{on:{click:()=>{panelKapat();kapatSonra(()=>algAc(a.id));history.back();}}},'Şemayı aç')));
        kart=el('div',{class:'kart'});liste.append(kart);}
      kart.append(dozSatir(d,w));
    }
    if(opt.alg)liste.append(el('div',{class:'dugmeler'},el('button',{on:{click:()=>{opt.alg=null;katCiz();hesap();}}},'Tüm '+KATAD[k]+' dozlarını göster')));
  }
  function dozSatir(d,w){
    const ok=w>0;const tek=d.d.length===1;
    let lo=d.d[0]*w,hi=(tek?d.d[0]:d.d[1])*w;
    const notlar=[];
    let ust=d.mx;if(d.mxKg&&w>d.mxKg[0])ust=d.mxKg[1];
    if(ok&&ust!=null){if(hi>ust){notlar.push('Maks '+fmt(ust)+' '+(d.b==='ml'?'ml':d.b)+' ile sınırlandı (hesap: '+fmt(hi)+')');hi=ust;if(lo>ust)lo=ust;}}
    if(ok&&d.mn!=null&&lo<d.mn){notlar.push('Minimum '+fmt(d.mn)+' '+d.b+' uygulandı (hesap: '+fmt(lo)+')');lo=Math.max(lo,d.mn);if(hi<d.mn)hi=d.mn;}
    if(ok&&d.mxLow!=null&&hi>d.mxLow)notlar.push('Yaşa göre üst sınır '+fmt(d.mxLow)+' '+d.b+' olabilir, aşağıdaki nota bakın');
    const birim=d.inf?'mcg/dk':d.b;
    const deger=ok?(fmt(lo)+(Math.abs(hi-lo)>1e-9?' – '+fmt(hi):'')):'—';
    const s=el('div',{class:'doz'},
      el('div',{class:'ad'},d.i),el('div',{class:'yol'},d.y+' · '+fmt(d.d[0],3)+(tek?'':'–'+fmt(d.d[1],3))+' '+(d.inf?d.b+'/kg/dk':d.b==='ml/saat'?'ml/kg/saat':d.b+'/kg')),
      el('div',{class:'sonucd'},deger,' ',el('small',{},birim),
        ok&&d.ml?el('small',{},'  =  '+fmt(d.ml[0]*w)+(d.ml[1]?'–'+fmt(d.ml[1]*w):'')+' ml'):null));
    notlar.forEach(n=>s.append(el('div',{class:'sinir'},'⚠️ '+n)));
    if(d.mxn)s.append(el('div',{class:'sinir'},'ℹ️ '+d.mxn));
    s.append(el('div',{class:'belge'},'Belge: “'+d.m+'” ',el('button',{on:{click:()=>{panelKapat();kapatSonra(()=>{const a=SAYFA_ALG[d.s];if(a)algAc(a.id,a.kn.includes(d.s)?'kn':'alg');});history.back();}}},'s. '+basNo(d.s))));
    if(d.inf)s.append(el('button',{class:'infbtn',on:{click:()=>{panelKapat();kapatSonra(()=>infAc({doz:d.d[0],birim:'mcgkgdk',ilac:d.i}));history.back();}}},'💧 İnfüzyon hızını hesapla'));
    return s;
  }
  kg.i.addEventListener('input',hesap);ara.addEventListener('input',()=>{filtre=ara.value;hesap();});
  katCiz();
  panelAc('💊 Doz hesaplayıcı',el('div',{class:'ic'},kg.kutu,uy,
    el('div',{class:'bilgi'},'Yalnızca belgedeki kiloya bağlı dozlar listelenir; aynı ilacın her algoritmadaki dozu ayrı satırdadır. Sabit dozlar (ör. yetişkin arrestte adrenalin 1 mg) şemadadır. Şemadaki 📞 simgesi SKKM/ÇM onayı gerektirir. Uygulamadan önce şemayı kontrol edin.'),
    katlar,el('div',{class:'alan'},ara),liste));
  hesap();if(!KG)setTimeout(()=>kg.i.focus(),100);
}

  const kg=giris('ifkg','Hastanın kilosu','(kg)',KG??'');

  if(opt.birim)birim.value=opt.birim;
  const mg=giris('ifmg','Seruma katılan toplam ilaç','(mg)','');
  const iml=giris('ifiml','Katılan ilacın hacmi','(ml; bilinmiyorsa 0)','0');
  const sml=giris('ifsml','Serum hacmi','(ml)','');

    el('button',{on:{click:()=>{mg.i.value='1';iml.i.value='0';sml.i.value='500';set.value='20';hesap();toast('Belge: 500 ml %0,9 NaCl içine 1 mg adrenalin');}}},'Adrenalin 1 mg / 500 ml (belge s. 97)'),
    el('button',{on:{click:()=>{mg.i.value='100';iml.i.value='0';sml.i.value='500';set.value='20';hesap();toast('Belge: 500 ml %0,9 NaCl içine 100 mg dopamin');}}},'Dopamin 100 mg / 500 ml (belge s. 15)'));
  function hesap(){
    const w=sayi(kg.i.value),ds=sayi(doz.i.value),m=sayi(mg.i.value),v1=sayi(iml.i.value)||0,v2=sayi(sml.i.value),gtt=+set.value,tr=sayi(ters.i.value);

    const hacim=v1+v2,kons=m*1000/hacim; // mcg/ml
    const kutu=(e,d,ana)=>el('div',{class:ana?'ana':''},el('span',{},e),el('b',{},d));
    const g=el('div',{class:'sonuclar'});
    if(ds>0&&(!kgGerek||w>0)){
      const mcgdk=birim.value==='mcgkgdk'?ds*w:birim.value==='mgkgdk'?ds*1000*w:ds;
      const mldk=mcgdk/kons,mlsa=mldk*60,dam=mldk*gtt;
      g.append(kutu('Serum seti damla hızı ('+gtt+' damla/ml)',fmt(dam,0)+' damla/dk',true),
        kutu('Pompa ayarı',fmt(mlsa,1)+' ml/saat'),kutu('İnfüzyon hızı',fmt(mldk,2)+' ml/dk'),
        kutu('Hasta dozu',fmt(mcgdk)+' mcg/dk'),kutu('Konsantrasyon',fmt(kons)+' mcg/ml'));
      if(dam>0&&dam<5)sonuc.append(el('div',{class:'uyari'},'⚠️ Damla hızı çok düşük; mikroset (60) daha doğru olur.'));
      if(dam>180)sonuc.append(el('div',{class:'uyari'},'⚠️ Damla hızı çok yüksek; konsantrasyonu kontrol edin.'));
    }else g.append(kutu('Konsantrasyon',fmt(kons)+' mcg/ml'),kutu('Toplam hacim',fmt(hacim)+' ml'));
    sonuc.append(g);
    if(tr>0){
      const mcgdk=tr/gtt*kons;
      sonuc.append(el('div',{class:'sonuclar'},kutu('Giden doz ('+fmt(tr,0)+' damla/dk)',w>0?fmt(mcgdk/w,3)+' mcg/kg/dk':fmt(mcgdk)+' mcg/dk',true),kutu('Dakikada',fmt(mcgdk)+' mcg/dk'),kutu('Saatte',fmt(tr/gtt*60,1)+' ml/saat')));
    }
  }
  [kg,doz,mg,iml,sml,ters].forEach(x=>x.i.addEventListener('input',hesap));[birim,set].forEach(x=>x.addEventListener('change',hesap));
  panelAc('💧 İnfüzyon hesaplayıcı'+(opt.ilac?' · '+opt.ilac:''),el('div',{class:'ic'},
    el('div',{class:'iki'},kg.kutu,doz.kutu),
    el('div',{class:'alan'},el('label',{for:'ifbirim'},'Doz birimi'),birim),
    el('div',{class:'bilgi'},'Hazır karışımlar (belgedeki pratik hesaplar):'),hazir,
    el('div',{class:'iki'},mg.kutu,iml.kutu),
    el('div',{class:'iki'},sml.kutu,el('div',{class:'alan'},el('label',{for:'ifset'},'Set tipi'),set)),
    sonuc,ters.kutu,
    el('div',{class:'bilgi'},'Formül: konsantrasyon = mg × 1000 / (ilaç ml + serum ml); ml/dk = doz(mcg/dk) / konsantrasyon; damla/dk = ml/dk × set. 1 mg = 1000 mcg. Ondalık için virgül veya nokta kullanılabilir.')));

/* ---------- KPR ZAMANLAYICI ---------- */
const K={bas:0,dongu:0,adr:0,sok:0,adrSay:0,kayit:[],metro:false,t:null};
let ses=null,metroT=null;
function kprAktif(){return K.bas>0;}
function bip(f=880,ms=150,v=.3){try{ses=ses||new (window.AudioContext||window.webkitAudioContext)();const o=ses.createOscillator(),g=ses.createGain();o.frequency.value=f;g.gain.value=v;o.connect(g);g.connect(ses.destination);o.start();o.stop(ses.currentTime+ms/1000);}catch(e){}}
const sure=ms=>{const s=Math.floor(ms/1000);return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');};
function kprAc(){
  const saat=el('div',{class:'saat'},'00:00');
  const dongu=el('div',{class:'dongu'},'Başlatmak için dokunun');
  const basBtn=el('button',{class:'bas'},'▶ KPR BAŞLAT');
  const adrBtn=el('button',{},'💉 Adrenalin verildi',el('small',{},'3-5 dk da bir'));
  const sokBtn=el('button',{},'⚡ Şok verildi',el('small',{},'0'));
  const metBtn=el('button',{},'🔊 Metronom',el('small',{},'Kapalı (110/dk)'));
  const nabBtn=el('button',{},'🔄 Döngüyü sıfırla',el('small',{},'Ritim/nabız bakıldı'));
  const kayit=el('div',{class:'kayit'});
  const bitir=el('button',{class:'gizli',style:'grid-column:1/-1;min-height:50px'},'■ Bitir (2 kez dokunun)');
  function log(m){K.kayit.unshift(sure(Date.now()-K.bas)+'  '+m);kayitCiz();}
  function kayitCiz(){kayit.innerHTML='';K.kayit.forEach(x=>kayit.append(el('div',{},x)));}
  function guncelle(){
    if(!K.bas)return;const n=Date.now();
    saat.textContent=sure(n-K.bas);
    const kalan=120000-((n-K.dongu)%120000),gecen=n-K.dongu;
    if(gecen>=120000&&!K.alarm){K.alarm=true;bip(1000,400,.5);if(navigator.vibrate)navigator.vibrate([300,150,300]);}
    if(K.alarm){dongu.textContent='⚠️ RİTİM / NABIZ KONTROLÜ ('+sure(gecen-120000)+' geçti)';dongu.classList.add('alarm');}
    else{dongu.textContent='Ritim kontrolüne '+sure(kalan);dongu.classList.remove('alarm');if(kalan<10500&&kalan>9500&&!K.u10){K.u10=1;bip(660,120);}}
    if(K.adr){const a=n-K.adr;adrBtn.lastChild.textContent='Son: '+sure(a)+' önce'+(a>=300000?' — 5 dk geçti':a>=180000?' — verilebilir':'');
      adrBtn.classList.toggle('adr-yesil',a>=180000&&a<300000);adrBtn.classList.toggle('adr-kirmizi',a>=300000);
      if(a>=180000&&!K.adrUy){K.adrUy=1;bip(520,250);}}
  }
  basBtn.onclick=()=>{
    if(!K.bas){K.bas=K.dongu=Date.now();K.alarm=false;K.u10=0;log('KPR başladı');basBtn.textContent='⏸ Çalışıyor';basBtn.classList.add('dur');bitir.classList.remove('gizli');uyanikYap(true);K.t=setInterval(guncelle,250);guncelle();bip(880,80);}
  };
  nabBtn.onclick=()=>{if(!K.bas)return;K.dongu=Date.now();K.alarm=false;K.u10=0;log('Ritim/nabız değerlendirildi');guncelle();};
  adrBtn.onclick=()=>{if(!K.bas)basBtn.onclick();K.adr=Date.now();K.adrSay++;K.adrUy=0;log('Adrenalin ('+K.adrSay+'. doz)');guncelle();};
  sokBtn.onclick=()=>{if(!K.bas)basBtn.onclick();K.sok++;sokBtn.lastChild.textContent=String(K.sok);log('Şok ('+K.sok+'.)');};
  metBtn.onclick=()=>{K.metro=!K.metro;metBtn.lastChild.textContent=K.metro?'Açık (110/dk)':'Kapalı (110/dk)';clearInterval(metroT);if(K.metro){bip(1200,30,.25);metroT=setInterval(()=>bip(1200,30,.25),60000/110);}};
  let son2=0;bitir.onclick=()=>{const n=Date.now();if(n-son2<1500){clearInterval(K.t);clearInterval(metroT);log('KPR bitti');Object.assign(K,{bas:0,dongu:0,adr:0,sok:0,adrSay:0,metro:false,alarm:false});basBtn.textContent='▶ KPR BAŞLAT';basBtn.classList.remove('dur');bitir.classList.add('gizli');saat.textContent='00:00';dongu.textContent='Başlatmak için dokunun';dongu.classList.remove('alarm');sokBtn.lastChild.textContent='0';metBtn.lastChild.textContent='Kapalı (110/dk)';adrBtn.lastChild.textContent='3-5 dk da bir';adrBtn.classList.remove('adr-yesil','adr-kirmizi');}else{son2=n;toast('Bitirmek için tekrar dokunun');}};
  if(K.bas){basBtn.textContent='⏸ Çalışıyor';basBtn.classList.add('dur');bitir.classList.remove('gizli');sokBtn.lastChild.textContent=String(K.sok);metBtn.lastChild.textContent=K.metro?'Açık (110/dk)':'Kapalı (110/dk)';clearInterval(K.t);K.t=setInterval(guncelle,250);guncelle();}
  kayitCiz();
  panelAc('⏱️ KPR zamanlayıcı',el('div',{class:'ic kpr'},saat,dongu,
    el('div',{class:'izgara'},basBtn,adrBtn,sokBtn,nabBtn,metBtn,
      el('button',{on:{click:()=>{panelKapat();kapatSonra(()=>algAc(D.k==='c'||D.k==='n'?'C-12':'Y-09'));history.back();}}},'📋 Arrest şeması',el('small',{},D.k==='c'||D.k==='n'?'Çocuk':'Yetişkin')),bitir),
    el('div',{class:'bilgi'},'Belgeye göre: dakikada 100-120 bası; 2 dakikada bir ritim ve nabız değerlendirmesi ve bası yapanın değişmesi; adrenalin 3-5 dakikada bir (yetişkin s. 19-22, çocuk s. 106-110). Zamanlayıcı panel kapansa da arka planda sayar.'),
    kayit));
}

  }
  else if(!yaz&&D.alg&&(e.key==='ArrowRight'||e.key==='ArrowLeft')){const a=ALGID[D.alg];const l=a.k==='g'?ALG.filter(x=>x.k==='g'):katAlg(a.k);const h=l[l.indexOf(a)+(e.key==='ArrowRight'?1:-1)];if(h)algAc(h.id);}
});
